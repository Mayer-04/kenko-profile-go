services:
  mongo:
    depends_on:
      mongo-keygen:
        condition: service_completed_successfully
    image: mongo:8.3-noble
    container_name: kenko-mongo
    # reinicia el contenedor si falla, salvo que lo hayas detenido manualmente.
    restart: unless-stopped
    stop_grace_period: 60s

    # D9-A: replica set de un nodo para transacciones multidocumento en local.
    # (Con --auth, el replica set exige --keyFile: ver volumen mongo_key.)
    command: ["--auth", "--replSet", "kenkoRs", "--keyFile", "/key/mongo-keyfile", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?define MONGO_INITDB_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?define MONGO_INITDB_ROOT_PASSWORD en .env}
      # Usados por el script de init para crear el usuario de la aplicación
      MONGO_APP_DB: ${MONGO_APP_DATABASE:?define MONGO_APP_DB en .env}
      MONGO_APP_USER: ${MONGO_APP_USERNAME:?define MONGO_APP_USER en .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?define MONGO_APP_PASSWORD en .env}

    volumes:
      - mongo_data:/data/db
      - mongo_key:/key:ro
      - ./init:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:27017:27017"

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Genera el keyFile del replica set con permisos 600 y dueño mongodb (999).
  # Se ejecuta como root dentro del contenedor para poder hacer chown.
  # keyFile en una sola línea (sin saltos): Mongo exige 6-1024 chars base64 usable.
  mongo-keygen:
    image: mongo:8.3-noble
    container_name: kenko-mongo-keygen
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -s /key/mongo-keyfile ]; then
          head -c 756 /dev/urandom | base64 | tr -d '\r\n' > /key/mongo-keyfile
          chmod 600 /key/mongo-keyfile
          chown 999:999 /key/mongo-keyfile
          echo "keyFile generado"
        else
          echo "keyFile existente"
        fi
    volumes:
      - mongo_key:/key
    security_opt:
      - no-new-privileges:true

  # Inicia el replica set una sola vez (idempotente: ignora "already initialized").
  # Con reintentos: mongod puede aún no aceptar conexiones aunque el healthcheck
  # haya pasado; sin loop el primer `up` falla con ECONNREFUSED (solo dev).
  mongo-init:
    image: mongo:8.3-noble
    container_name: kenko-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        attempt=1
        max_attempts=30
        until mongosh --quiet --host mongo -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'try { rs.initiate({_id:"kenkoRs", members:[{_id:0, host:"mongo:27017"}]}) } catch (e) { var m = (e && e.message) ? e.message : JSON.stringify(e); if (!/already initialized/.test(m)) throw e }'; do
          if [ "$$attempt" -ge "$$max_attempts" ]; then echo "mongo-init: rs.initiate falló tras $$max_attempts intentos"; exit 1; fi
          echo "mongo-init: rs.initiate intento $$attempt/$$max_attempts fallido, reintentando en 2s..."
          attempt=$$((attempt+1))
          sleep 2
        done
        attempt=1
        until mongosh --quiet --host mongo -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval 'quit(db.adminCommand({replSetGetStatus: 1}).ok === 1 ? 0 : 1)'; do
          if [ "$$attempt" -ge "$$max_attempts" ]; then echo "mongo-init: replSetGetStatus falló tras $$max_attempts intentos"; exit 1; fi
          echo "mongo-init: replSetGetStatus intento $$attempt/$$max_attempts fallido, reintentando en 2s..."
          attempt=$$((attempt+1))
          sleep 2
        done
        echo "mongo-init: replica set listo"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?define MONGO_INITDB_ROOT_USERNAME en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?define MONGO_INITDB_ROOT_PASSWORD en .env}
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    container_name: kenko-profile-api
    user: ${UID:-1000}:${GID:-1000}
    restart: unless-stopped
    command: ["/app/api"]
    env_file: .env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?define MONGO_APP_USERNAME en .env}:${MONGO_APP_PASSWORD:?define MONGO_APP_PASSWORD en .env}@mongo:27017/${MONGO_APP_DATABASE:?define MONGO_APP_DATABASE en .env}?authSource=${MONGO_APP_DATABASE:?define MONGO_APP_DATABASE en .env}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ${HOME}/.aws:/aws:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: .
    container_name: kenko-profile-worker
    user: ${UID:-1000}:${GID:-1000}
    restart: unless-stopped
    command: ["/app/worker"]
    env_file: .env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?define MONGO_APP_USERNAME en .env}:${MONGO_APP_PASSWORD:?define MONGO_APP_PASSWORD en .env}@mongo:27017/${MONGO_APP_DATABASE:?define MONGO_APP_DATABASE en .env}?authSource=${MONGO_APP_DATABASE:?define MONGO_APP_DATABASE en .env}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ${HOME}/.aws:/aws:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  relay:
    build: .
    container_name: kenko-profile-relay
    user: ${UID:-1000}:${GID:-1000}
    restart: unless-stopped
    command: ["/app/relay"]
    env_file: .env
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:?define MONGO_APP_USERNAME en .env}:${MONGO_APP_PASSWORD:?define MONGO_APP_PASSWORD en .env}@mongo:27017/${MONGO_APP_DATABASE:?define MONGO_APP_DATABASE en .env}?authSource=${MONGO_APP_DATABASE:?define MONGO_APP_DATABASE en .env}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ${HOME}/.aws:/aws:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
  mongo_key:
