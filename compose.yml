services:
  mongodb:
    image: mongo:8.3-noble
    container_name: kenko-mongo
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Falta usuario administrador}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Falta contraseña administradora}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Falta usuario de aplicación}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Falta contraseña de aplicación}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:?Falta nombre de base de datos}

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongo/init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mongodb_data:
